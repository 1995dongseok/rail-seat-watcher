<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기차 빈자리 조회 · 관리자</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#e3e6ea; --text:#1d2430; --muted:#6b7480; --ok:#158a4a; --ok-bg:#e6f6ec; --no:#b42323; --no-bg:#fbe9e9; --accent:#0b5fb3; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
  main { max-width:1000px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:20px; margin:0; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-top:16px; }
  a { color:var(--accent); }
  button { padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:#fff; font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--no); }
  button:disabled { opacity:.5; cursor:default; }
  input { padding:6px 8px; border:1px solid var(--line); border-radius:6px; font:inherit; width:150px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:8px 6px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; vertical-align:middle; }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  .tag { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:600; }
  .ok { background:var(--ok-bg); color:var(--ok); } .no { background:var(--no-bg); color:var(--no); }
  .muted { color:var(--muted); }
  .msg { margin-top:10px; font-size:13px; color:var(--muted); } .msg.err { color:var(--no); }
  .wrap { overflow-x:auto; }
</style>
</head>
<body>
<main>
  <div class="row">
    <h1>관리자 · 사용자 관리</h1>
    <span style="flex:1"></span>
    <a href="/">조회 화면으로</a>
    <button type="button" id="btn_logout">로그아웃</button>
  </div>
  <p class="muted" style="margin:6px 0 0">신규 가입자는 기본 <b>거부</b> 상태입니다. 허용해야 조회와 감시를 쓸 수 있습니다. 텔레그램은 사용자가 봇에게 연결 코드를 보내면 자동으로 연결되며, 필요하면 여기서 chat_id 를 직접 고칠 수 있습니다.</p>

  <div class="card">
    <div class="wrap">
      <table>
        <thead><tr><th>사용자</th><th>가입일</th><th>사용</th><th>코레일 계정</th><th>텔레그램 chat_id</th><th>감시 (활성/상한)</th><th></th></tr></thead>
        <tbody id="body"><tr><td colspan="7" class="muted">불러오는 중…</td></tr></tbody>
      </table>
    </div>
    <div class="msg" id="msg"></div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  if (r.status === 401) { location.href = '/login'; throw new Error('로그인이 필요합니다'); }
  if (r.status === 403) { location.href = '/'; throw new Error('관리자만 사용할 수 있습니다'); }
  const body = await r.json().catch(() => ({}));
  if (!r.ok) { const d = body.detail; throw new Error(Array.isArray(d) ? d.map(x => x.msg).join(', ') : (d || r.statusText)); }
  return body;
}
function setMsg(t, err = false) { $('msg').textContent = t; $('msg').className = 'msg' + (err ? ' err' : ''); }

async function load() {
  const users = await api('/api/admin/users');
  const body = $('body'); body.innerHTML = '';
  for (const u of users) {
    const tr = document.createElement('tr');
    tr.innerHTML =
      `<td><b>${esc(u.username)}</b>${u.is_admin ? ' <span class="tag ok">관리자</span>' : ''}</td>` +
      `<td class="muted">${esc((u.created_at || '').replace('T', ' '))}</td>` +
      `<td>${u.allowed ? '<span class="tag ok">허용</span>' : '<span class="tag no">거부</span>'} ` +
        (u.is_admin ? '' : `<button data-act="toggle" data-id="${esc(u.id)}" data-next="${u.approved ? 'false' : 'true'}">${u.approved ? '거부로 변경' : '허용'}</button>`) + `</td>` +
      `<td>${u.korail_configured ? '<span class="tag ok">등록됨</span>' : '<span class="muted">미등록</span>'}</td>` +
      `<td><input data-chat="${esc(u.id)}" value="${esc(u.telegram_chat_id)}" placeholder="미연결" inputmode="numeric"> <button data-act="chat" data-id="${esc(u.id)}">저장</button>` +
        (u.telegram_name ? `<div class="muted" style="font-size:12px">${esc(u.telegram_name)}</div>` : '') + `</td>` +
      `<td>${u.active_watches}건 / ` + (u.is_admin ? '무제한' :
        `<input data-limit="${esc(u.id)}" type="number" min="0" max="20" value="${u.watch_limit}" style="width:60px"> <button data-act="limit" data-id="${esc(u.id)}">저장</button>`) + `</td>` +
      `<td>${u.is_admin ? '' : `<button class="danger" data-act="del" data-id="${esc(u.id)}" data-name="${esc(u.username)}">삭제</button>`}</td>`;
    body.appendChild(tr);
  }
  if (!users.length) body.innerHTML = '<tr><td colspan="7" class="muted">사용자가 없습니다.</td></tr>';
}

$('body').addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const id = b.dataset.id;
  try {
    if (b.dataset.act === 'toggle') {
      await api(`/api/admin/users/${id}`, { method: 'PUT', body: JSON.stringify({ approved: b.dataset.next === 'true' }) });
      setMsg('사용 상태를 바꿨습니다.');
    } else if (b.dataset.act === 'chat') {
      const v = document.querySelector(`input[data-chat="${id}"]`).value;
      await api(`/api/admin/users/${id}`, { method: 'PUT', body: JSON.stringify({ telegram_chat_id: v }) });
      setMsg('chat_id 를 저장했습니다.');
    } else if (b.dataset.act === 'limit') {
      const v = parseInt(document.querySelector(`input[data-limit="${id}"]`).value, 10);
      if (Number.isNaN(v) || v < 0 || v > 20) throw new Error('감시 상한은 0~20 사이 숫자여야 합니다.');
      await api(`/api/admin/users/${id}`, { method: 'PUT', body: JSON.stringify({ watch_limit: v }) });
      setMsg('감시 상한을 저장했습니다.');
    } else if (b.dataset.act === 'del') {
      if (!confirm(`${b.dataset.name} 사용자와 그 감시 목록을 삭제할까요?`)) return;
      await api(`/api/admin/users/${id}`, { method: 'DELETE' });
      setMsg('삭제했습니다.');
    }
    load();
  } catch (err) { setMsg(err.message, true); }
});
$('btn_logout').addEventListener('click', async () => { try { await api('/api/auth/logout', { method: 'POST' }); } finally { location.href = '/login'; } });
load().catch(err => setMsg(err.message, true));
</script>
</body>
</html>
